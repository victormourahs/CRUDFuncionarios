<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Funcionários | Node.js</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
  <header class="top"><div><span class="eyebrow">NODE.JS + MONGODB</span><h1>Gestão de Funcionários</h1><p>Cadastre, consulte, edite e remova registros.</p></div><span class="tag">CRUD completo</span></header>
  <section class="panel"><h2 id="form-title">Novo funcionário</h2>
    <form id="form"><input type="hidden" id="id">
      <div class="fields"><label>Matrícula<input id="matricula" maxlength="40" required placeholder="Ex.: 1001"></label><label>Nome<input id="nome" maxlength="120" required placeholder="Nome completo"></label><label>Salário (R$)<input id="salario" type="number" step="0.01" min="0" required placeholder="0,00"></label><label>Função<input id="funcao" maxlength="100" required placeholder="Ex.: Analista"></label></div>
      <div class="actions"><button class="primary" type="submit" id="save">Adicionar funcionário</button><button type="button" class="secondary" id="cancel" hidden>Cancelar edição</button></div>
    </form>
  </section>
  <section class="panel"><div class="list-head"><div><h2>Funcionários cadastrados</h2><p id="count">Carregando...</p></div><input id="busca" type="search" placeholder="Buscar nome, matrícula ou função" aria-label="Buscar funcionários"></div>
    <div id="message" class="message" role="status" hidden></div>
    <div class="table-scroll"><table><thead><tr><th>Matrícula</th><th>Nome</th><th>Função</th><th>Salário</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
  <footer>Exemplo acadêmico • Exclusão física</footer>
</main><script src="app.js" defer></script>
</body></html>
